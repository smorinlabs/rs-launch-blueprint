[package]
name = "rs-launch-blueprint-web"
version.workspace = true
edition.workspace = true
include = ["/src"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Optional web service front end for rs-launch-blueprint."

[features]
default = []
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
]

[dependencies]
axum = "0.8.9"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
http-body = "1.0.1"
metrics = { version = "0.24.6", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", optional = true, default-features = false }
opentelemetry = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false, features = [
    "trace",
] }
opentelemetry-http = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false }
problem_details = { version = "0.10.0", features = ["axum", "json"] }
rs-launch-blueprint-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.7.1", default-features = false, features = [
    "catch-panic",
    "cors",
    "limit",
    "request-id",
    "sensitive-headers",
    "set-header",
    "timeout",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = ">=0.34.0, <0.35.0", optional = true, default-features = false }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[dev-dependencies]
expectorate = "1.3.0"
oas3 = "0.22.0"
proptest = "1.11.0"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
