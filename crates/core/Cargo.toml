[package]
name = "rs-launch-blueprint-core"
version = "0.1.0"
authors.workspace = true
categories = ["development-tools"]
edition.workspace = true
homepage.workspace = true
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/LICENSE-MIT",
]
keywords = ["blueprint", "domain", "hexagonal", "library"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Core domain models, ports, services, and error catalog for rs-launch-blueprint."

[package.metadata.docs.rs]
all-features = true

[features]
default = ["config"]
config = ["dep:etcetera", "dep:toml", "dep:toml_edit"]
mock = ["dep:mockall"]

[dependencies]
etcetera = { version = "0.11.0", optional = true }
mockall = { version = "0.15.0", optional = true }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = { version = "1.1.6", optional = true }
toml_edit = { version = "0.25.15", optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
