[package]
name = "rs-launch-blueprint-core"
version.workspace = true
edition.workspace = true
include = ["/src"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core domain models, ports, services, and error catalog for rs-launch-blueprint."

[features]
default = []
mock = ["dep:mockall"]

[dependencies]
etcetera = "0.11.0"
mockall = { version = "0.15.0", optional = true }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
