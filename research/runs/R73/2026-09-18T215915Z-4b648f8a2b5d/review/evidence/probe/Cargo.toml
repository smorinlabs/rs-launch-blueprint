[package]
name = "r73_probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body = "1"
