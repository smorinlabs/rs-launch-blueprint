nextest-version = { recommended = "0.9.146" }

[profile.default]
# F125: marked SLOW at 30 s and terminated at 60 s (2 periods), py's `timeout = 60`.
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 0

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

# A test in a `slow` module raises its own cap, like @pytest.mark.timeout(N).
[[profile.default.overrides]]
filter = 'test(/(^|::)slow::/)'
slow-timeout = { period = "60s", terminate-after = 5 }
