[package]
name = "r56probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
secrecy = "0.10.3"
zeroize = "1.9.0"
toml = "1.1.6"
keyring-core = { version = "1.0.0", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", optional = true }

[features]
default = []
keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
