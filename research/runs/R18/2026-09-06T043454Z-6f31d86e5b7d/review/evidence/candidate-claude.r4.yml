# LINT FIXTURE ONLY — not a shipped workflow. Revision 4 of the assistant-lane
# candidate. See the header of candidate-claude-code-review.r4.yml. The
# revision-2 and revision-3 fixtures (candidate-claude.yml, .r3.yml) are left
# byte-for-byte as they were linted and audited.
#
# The YAML below is UNCHANGED from candidate-claude.r3.yml. Revision 4 changes
# only this header, and only to correct two statements revision 3 made about
# the action's source and to state what an adopter is accepting.
#
# CORRECTION 1 — the r3 header said an organization MEMBER without write access
# "is then refused by the action's own checkWritePermissions". The refusal is
# real but it does NOT live in either mode. At v1.0.220
# (action-entrypoint-plugins-v1.0.220.log, E2):
#   src/entrypoints/prepare.ts:37  const githubToken = await setupGitHubToken();
#   src/entrypoints/prepare.ts:44  await checkWritePermissions(...)   <- shared entrypoint
#   src/modes/tag/index.ts:43      await checkHumanActor(...)         <- per mode
#   src/modes/agent/index.ts:30    await checkHumanActor(...)         <- per mode
# `grep -c checkWritePermissions` is 0 in both mode files.
#
# CORRECTION 2 — the ordering, which is the reason the job-level `if:` below is
# load-bearing rather than merely defence in depth. setupGitHubToken() at
# prepare.ts:37 runs BEFORE the write check at :44 and before checkHumanActor in
# either mode. It exchanges the workflow's OIDC token for a Claude GitHub App
# installation token at
# https://api.anthropic.com/api/github/github-app-token-exchange
# (src/github/token.ts:121). Because this lane sets `additional_permissions`,
# parseAdditionalPermissions() returns a value, so token.ts:100 sends
# DEFAULT_PERMISSIONS merged with it — contents: write, pull_requests: write,
# issues: write, actions: read (token.ts:69-73). A write-capable App token is
# therefore requested before any actor-trust check inside the action returns.
# Whether anything attacker-controlled is processed in that window was NOT
# traced: that is U14, and it is P03's to settle.
#
# WHAT AN ADOPTER MUST UNDERSTAND BEFORE SETTING ENABLE_CLAUDE_ASSISTANT:
#   1. On a PUBLIC repository this lane is reachable from text that an OWNER,
#      MEMBER or COLLABORATOR writes, and such an author routinely quotes
#      untrusted content — an issue body, a fork pull request's diff, a stack
#      trace. Neither the prefilter below nor any action-side check separates a
#      trusted author's own words from untrusted text that author pasted. This
#      residual is not removable by configuration.
#   2. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB is INACTIVE in this configuration:
#      action.yml:301 emits it only when allowed_non_write_users is non-empty,
#      which this configuration deliberately leaves at "".
#   3. The prefilter below is the only control that acts before the job is
#      scheduled once ENABLE_CLAUDE_ASSISTANT is true. Its runtime effect is
#      U12 and is unproven by this research.
#
# The clause below is the exact shape asked for by upstream issue
# anthropics/claude-code-action#1068 ("Default workflow template missing author
# trust gate — secrets exposed on public repos", open, labels bug /
# documentation / area:permissions / p1 — issue-1068.log). It is a prefilter,
# not a permission check: `author_association` is not the same predicate as
# write access. It would NOT have stopped the 2026-06-01 GMO Flatt Security
# disclosure's Phase 2, whose triggering comment was authored by a trusted user
# and whose body was tampered with afterwards; that vector is closed instead by
# the action's own isBodySafeToUse at v1.0.220.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      vars.ENABLE_CLAUDE_ASSISTANT == 'true' &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
       (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
       (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # None of this lane's four events is a `pull_request` event, so GITHUB_REF
      # is the default branch and this checkout brings in no pull-request head
      # content. Guard-contract clause (a), "never runs on a fork pull request",
      # binds the review lane only; see review/DECISION.md.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.220
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          additional_permissions: |
            actions: read
          # No `prompt:` input — omitting it selects interactive @claude mode.
