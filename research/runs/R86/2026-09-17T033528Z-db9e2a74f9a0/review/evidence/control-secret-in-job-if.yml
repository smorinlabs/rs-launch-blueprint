# R86 negative control — the one-line gate the owner's requirement would use if
# the credential were a repository VARIABLE. It is a SECRET, so this must fail.
# A check that cannot fail is not evidence; this file is the check that can.
name: Control - secret read in a job-level if
on:
  pull_request:
    types: [opened]
permissions: {}
jobs:
  gated:
    if: secrets.OPENAI_API_KEY != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Nothing
        run: echo "unreachable"
