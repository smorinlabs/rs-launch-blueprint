# R07 alternative fixture — ts-launch-blueprint @ cb1cbcb shape (option C):
# weekly cron + workflow_dispatch, no push. Used only to show the alternative
# is syntactically valid, i.e. syntax does not decide this item.
name: Update Contributors
on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  contributors-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: smorinlabs/contributors-please-action@v1.3.9
        with:
          pat: ${{ secrets.GITHUB_TOKEN }}
          output-file: CONTRIBUTORS.md
          state-file: .contributors.jsonl
          config-file: .contributors.yml
          mode: pull-request
