# Workspace dependency and crate-boundary policy (R02 F008, R58, R67, OV-18).
# Invoke with global `--all-features` first: `cargo deny --all-features check`

[graph]
all-features = true

[advisories]
ignore = [
    # Upstream zbus 6.0 crate-consolidation notices (not vulnerabilities) pulled only by
    # the opt-in `keychain` feature on Linux (`zbus-secret-service-keyring-store 1.0.1` ->
    # `secret-service 5.2.0` -> `zbus 5.19.0`); remove once `secret-service` adopts zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; optional keychain Linux dep still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; optional keychain Linux dep still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; optional keychain Linux dep still on zbus 5" },
]

[licenses]
# Permissive licenses covering our MIT/Apache-2.0 workspace and audited transitive deps
# (ring/rustls-webpki: ISC, subtle: BSD-3-Clause, unicode-ident: Unicode-3.0,
# webpki-roots Mozilla CA bundle: CDLA-Permissive-2.0,
# clipboard-win/error-code via arboard: BSL-1.0, foldhash via wl-clipboard-rs: Zlib).
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Wrapper entries strictly enforce standalone-library isolation (OV-18, R02 F008, R58, R67):
# neither `rs-launch-blueprint-core` nor the standalone root library `rs-launch-blueprint` may
# ever depend on CLI, web, OTel, subscriber, or `anyhow` crates.
deny = [
    { crate = "axum", wrappers = [
        "rs-launch-blueprint-web",
        "problem_details",
        "utoipa-axum",
    ], reason = "web framework crates belong exclusively to crates/web (R02 F008, OV-18)" },
    { crate = "problem_details", wrappers = [
        "rs-launch-blueprint-web",
    ], reason = "RFC 9457 problem_details is contained to crates/web/src/problems.rs (R70)" },
    { crate = "utoipa", wrappers = [
        "rs-launch-blueprint-web",
        "utoipa-axum",
    ], reason = "OpenAPI generation belongs exclusively to crates/web (R71, OV-18)" },
    { crate = "clap", wrappers = [
        "rs-launch-blueprint-cli",
        "rs-launch-blueprint-web",
        "clap_complete",
    ], reason = "CLI argument parsing belongs exclusively to binary crates (R02 F008, OV-18)" },
    { crate = "clap_complete", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "shell completion generation belongs to crates/cli only (R60)" },
    { crate = "inquire", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "interactive terminal prompting belongs to crates/cli only (R61, OV-18)" },
    { crate = "indicatif", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "terminal progress spinners belong to crates/cli only (R63, OV-18)" },
    { crate = "tabled", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "terminal table rendering belongs to crates/cli only (R66, OV-18)" },
    { crate = "arboard", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "desktop clipboard access belongs to crates/cli only (R62, OV-18)" },
    { crate = "signal-hook", wrappers = [
        "rs-launch-blueprint-cli",
        "crossterm",
        "signal-hook-mio",
    ], reason = "OS signal handling belongs to binary entrypoints (and CLI terminal backend crossterm) only (R67, OV-18)" },
    { crate = "tracing-subscriber", wrappers = [
        "rs-launch-blueprint-cli",
        "rs-launch-blueprint-web",
        "tracing-opentelemetry",
        "loom",
    ], reason = "subscriber initialization belongs to binary crates only (R58, OV-18); tracing-opentelemetry bridges layers (R78); loom is an inactive cfg(loom) dep of left-right" },
    { crate = "anyhow", wrappers = [
        "rs-launch-blueprint-cli",
        "prost-derive",
    ], reason = "library crates return typed thiserror errors; anyhow is confined to binary entrypoints (R67, OV-18); prost-derive uses it at proc-macro compile time under otel" },
    { crate = "opentelemetry", wrappers = [
        "rs-launch-blueprint-web",
        "opentelemetry_sdk",
        "opentelemetry-otlp",
        "opentelemetry-http",
        "opentelemetry-proto",
        "tracing-opentelemetry",
    ], reason = "OpenTelemetry SDK belongs exclusively to crates/web (R78, OV-18)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
