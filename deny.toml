# Workspace dependency and crate-boundary policy (R02 F008, R58, R67).
# Invoke with global `--all-features` first: `cargo deny --all-features check`

[graph]
all-features = true

[advisories]
ignore = [
    # Upstream zbus 6.0 crate-consolidation notices (not vulnerabilities) pulled only by
    # the opt-in `keychain` feature on Linux (`zbus-secret-service-keyring-store 1.0.1` ->
    # `secret-service 5.2.0` -> `zbus 5.19.0`); remove once `secret-service` adopts zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; optional keychain Linux dep still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; optional keychain Linux dep still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; optional keychain Linux dep still on zbus 5" },
]

[licenses]
# Permissive licenses covering our MIT/Apache-2.0 workspace and audited transitive deps
# (ring/rustls-webpki: ISC, subtle: BSD-3-Clause, unicode-ident: Unicode-3.0,
# webpki-roots Mozilla CA bundle: CDLA-Permissive-2.0,
# clipboard-win/error-code via arboard: BSL-1.0, foldhash via wl-clipboard-rs: Zlib).
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Wrapper entries enforce workspace boundaries (`axum`, `clap`, `clap_complete`, `tracing-subscriber`, `anyhow`).
deny = [
    { crate = "axum", wrappers = [
        "rs-launch-blueprint-web",
        "problem_details",
        "utoipa-axum",
    ], reason = "core and the CLI are framework-agnostic (F008)" },
    { crate = "problem_details", wrappers = [
        "rs-launch-blueprint-web",
    ], reason = "RFC 9457 problem_details is contained to crates/web/src/problems.rs (R70)" },
    { crate = "clap", wrappers = [
        "rs-launch-blueprint-cli",
        "rs-launch-blueprint",
        "clap_complete",
    ], reason = "argument parsing belongs to the CLI layer and to the serve binary's required global core (F008)" },
    { crate = "clap_complete", wrappers = [
        "rs-launch-blueprint-cli",
    ], reason = "shell completion generation belongs to the CLI crate only (R60)" },
    { crate = "tracing-subscriber", wrappers = [
        "rs-launch-blueprint",
        "tracing-opentelemetry",
        "loom",
    ], reason = "subscriber initialization belongs to the root composition package only (R58); tracing-opentelemetry depends on it for Layer bridging (R78); loom is an inactive cfg(loom) target dep of left-right via metrics-exporter-prometheus (R79)" },
    { crate = "anyhow", wrappers = [
        "rs-launch-blueprint",
        "prost-derive",
    ], reason = "library crates return typed errors; anyhow is confined to binary entrypoints (R67); prost-derive uses it at proc-macro compile time under otel (R78)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
