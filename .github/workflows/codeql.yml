# CodeQL static analysis for Rust (R16, F027, F045).
# Advanced setup: this workflow + .github/codeql/codeql-config.yml ARE the
# CodeQL config. The repository's "default setup" (Settings > Code security >
# Code scanning) must stay disabled, or SARIF upload fails with a configuration
# error. The visibility preflight checks both public visibility and whether
# GitHub's default setup is currently active so newly created forks and repos
# that have not yet disabled default setup skip cleanly with an actionable notice.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC
  public:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-visibility:
    name: inspect repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Inspect repository visibility via GitHub REST API
      security-events: read # Check whether Code Scanning Default Setup conflicts with advanced setup
    outputs:
      is-public: ${{ steps.visibility.outputs.is_public }}
      can-analyze: ${{ steps.visibility.outputs.can_analyze }}
    steps:
      - name: Inspect repository visibility and Code Scanning setup mode
        id: visibility
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repository } = await github.rest.repos.get(context.repo);
            const isPublic = repository.visibility === "public";
            let defaultSetupState = "not-configured";
            if (isPublic) {
              try {
                const { data: setup } = await github.request(
                  "GET /repos/{owner}/{repo}/code-scanning/default-setup",
                  context.repo,
                );
                defaultSetupState = setup?.state || "not-configured";
              } catch (err) {
                core.info(`Could not query Code Scanning default setup (${err.status || err.message}); proceeding.`);
              }
            }
            const canAnalyze = isPublic && defaultSetupState !== "configured";
            if (isPublic && defaultSetupState === "configured") {
              core.notice(
                "Code Scanning Default Setup is enabled on this repository, which conflicts with advanced CodeQL SARIF upload. Disable Default Setup under Settings > Code security > Code scanning to activate .github/workflows/codeql.yml.",
                { title: "CodeQL advanced setup deferred" },
              );
              await core.summary
                .addHeading("CodeQL advanced setup skipped — Default Setup is active", 3)
                .addRaw(
                  "GitHub Code Scanning **Default Setup** is currently `configured` on this repository. " +
                    "Advanced setup SARIF uploads fail when Default Setup is active.\n\n" +
                    "To activate `.github/workflows/codeql.yml` (with `.github/codeql/codeql-config.yml` `security-extended`), " +
                    "disable Default Setup in **Settings → Code security → Code scanning**.\n",
                )
                .write();
            }
            core.setOutput("is_public", String(isPublic));
            core.setOutput("can_analyze", String(canAnalyze));

  analyze:
    needs: repository-visibility
    if: ${{ needs.repository-visibility.outputs.can-analyze == 'true' }}
    name: analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Check out repository sources for CodeQL extraction
      security-events: write # Upload CodeQL SARIF analysis results
      actions: read # Required by github/codeql-action for workflow metadata
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Init CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:rust"
