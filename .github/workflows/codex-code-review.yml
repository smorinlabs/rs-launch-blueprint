# Automated Codex PR Code Review (R86 rev 2, F361, R08, R09, R20).
#
# Three-job containment split:
# 1. `credential-preflight`: fork/draft/bot guards + detects `OPENAI_API_KEY`.
# 2. `codex-review`: holds `OPENAI_API_KEY` + `contents: read` only, runs under
#    `:read-only` + `drop-sudo` on the trusted base checkout with head fetched
#    as a ref only.
# 3. `post-review`: holds `pull-requests: write` and NO model credential.
#
# What an adopter accepts by installing OPENAI_API_KEY on a public repository:
# - Trusted-author prompt-injection residual (a maintainer quoting untrusted
#   content in PR descriptions or diffs); model output is posted verbatim.
# - `openai/codex-action` enforces its own write-access check on the run actor.
# - To opt out permanently, delete `.github/workflows/codex-code-review.yml`.
name: Codex code review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  credential-preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      credential: ${{ steps.detect.outputs.credential }}
    steps:
      - name: Detect credential presence
        id: detect
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY}" ]; then
            shape=present
          else
            shape=none
          fi
          echo "credential=${shape}" >> "$GITHUB_OUTPUT"
          if [ "${shape}" = none ]; then
            echo "::notice title=Codex code review is not configured::Set the repository secret OPENAI_API_KEY to enable this lane, or delete .github/workflows/codex-code-review.yml to remove it."
            {
              echo "### Codex code review did not run"
              echo
              echo "No \`OPENAI_API_KEY\` repository secret is configured, so this lane was skipped."
              echo "It did not fail."
              echo
              echo "* To enable it: add a repository secret named \`OPENAI_API_KEY\`."
              echo "* To remove it: delete \`.github/workflows/codex-code-review.yml\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "OPENAI_API_KEY is configured, so Codex code review will run on this pull request."
            echo "Delete .github/workflows/codex-code-review.yml to remove this lane."
          fi

  codex-review:
    needs: credential-preflight
    if: needs.credential-preflight.outputs.credential == 'present'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out trusted base branch and fetch PR head ref
    timeout-minutes: 20
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      # Trusted base checkout ensures PR-authored AGENTS.md is never loaded.
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the pull request head as a ref
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${HEAD_SHA}"
          git update-ref refs/codex/pr-head "${HEAD_SHA}"
      - name: Run Codex
        id: codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.154.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt-file: .github/codex/review-pr.md

  post-review:
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    # No model credential reaches this job; it only publishes finished text.
    permissions:
      pull-requests: write # Post the completed Codex review comment on the PR
    timeout-minutes: 5
    steps:
      - name: Post the review as a pull-request comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "$CODEX_FINAL_MESSAGE"
