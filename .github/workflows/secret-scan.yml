# Secret scanning CI workflow (R17 rev 12, owner ruling W0-R17b).
# Installs the pinned TruffleHog OSS CLI binary with Sigstore cosign + SHA-256
# verification and scans the full git history for verified live credentials.
# Exit code allow-list: only exit 0 passes (unpiped, under `shell: bash`).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: trufflehog (verified secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Check out full git history for secret scanning
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cosign 3.1.5
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cosign@3.1.5

      - name: Download, verify, and install TruffleHog 3.97.4
        shell: bash
        run: |
          set -euo pipefail
          ver="3.97.4"
          base="https://github.com/trufflesecurity/trufflehog/releases/download/v${ver}"
          tmp="${RUNNER_TEMP}/trufflehog-${ver}"
          mkdir -p "${tmp}/bin"
          curl -fsSL "${base}/trufflehog_${ver}_linux_amd64.tar.gz" -o "${tmp}/trufflehog_${ver}_linux_amd64.tar.gz"
          curl -fsSL "${base}/trufflehog_${ver}_checksums.txt" -o "${tmp}/trufflehog_${ver}_checksums.txt"
          curl -fsSL "${base}/trufflehog_${ver}_checksums.txt.sig" -o "${tmp}/trufflehog_${ver}_checksums.txt.sig"
          curl -fsSL "${base}/trufflehog_${ver}_checksums.txt.pem" -o "${tmp}/trufflehog_${ver}_checksums.txt.pem"

          cosign verify-blob \
            --certificate "${tmp}/trufflehog_${ver}_checksums.txt.pem" \
            --signature "${tmp}/trufflehog_${ver}_checksums.txt.sig" \
            --certificate-identity "https://github.com/trufflesecurity/trufflehog/.github/workflows/release.yml@refs/tags/v${ver}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${tmp}/trufflehog_${ver}_checksums.txt"

          (
            cd "${tmp}"
            grep "  trufflehog_${ver}_linux_amd64.tar.gz\$" "trufflehog_${ver}_checksums.txt" | sha256sum -c -
          )

          tar -xzf "${tmp}/trufflehog_${ver}_linux_amd64.tar.gz" -C "${tmp}/bin" trufflehog
          chmod 755 "${tmp}/bin/trufflehog"
          echo "${tmp}/bin" >> "${GITHUB_PATH}"
          "${tmp}/bin/trufflehog" --version

      - name: Scan full repository history for verified credentials
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          trufflehog git file://. \
            --only-verified \
            --fail \
            --fail-on-scan-errors \
            --github-actions || rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error::TruffleHog failed with exit code ${rc} (only exit 0 is allowed)"
            exit "${rc}"
          fi
