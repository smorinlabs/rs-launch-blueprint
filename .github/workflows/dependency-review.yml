# Dependency Review Action (F046, R08, R09, R20).
# Scans dependency manifest changes on PRs targeting main and posts a summary.
# GitHub Dependency Review requires GitHub Code Security in private repos;
# the job activates automatically when the repository is public.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out repository manifests for dependency diff
      pull-requests: write # Required for comment-summary-in-pr: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: always
