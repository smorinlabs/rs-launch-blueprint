# Automated Claude Code PR Review (R18 rev 6, R08, R09, R20).
#
# Credential-presence gating (no enable variable):
# - Runs when either a static credential (`ANTHROPIC_API_KEY` or
#   `CLAUDE_CODE_OAUTH_TOKEN`) OR Anthropic workload identity federation
#   (`ANTHROPIC_FEDERATION_RULE_ID` + `ANTHROPIC_ORGANIZATION_ID`) is set.
# - Skips cleanly without failing when no credential is configured.
# - To opt out permanently, delete `.github/workflows/claude-code-review.yml`.
#
# What an adopter accepts by installing a credential on a public repository:
# 1. A trusted-author prompt-injection residual that no configuration in this
#    file removes: a PR diff written by a write-access author routinely quotes
#    untrusted text, and nothing here separates the two.
# 2. Once `claude-review` starts, the action exchanges the workflow OIDC token
#    for a Claude GitHub App installation token before internal actor checks
#    return; the job-level `if:` guards on `credential-preflight` are the only
#    controls that act beforehand.
# 3. `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB` is inactive because
#    `allowed_non_write_users` stays empty.
# 4. If the repository already holds `ANTHROPIC_API_KEY` or
#    `CLAUDE_CODE_OAUTH_TOKEN` for an unrelated purpose, this lane activates on
#    the next qualifying PR automatically; delete this file to opt out.
name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  credential-preflight:
    # Carries every fork, draft, and bot guard so rejected events spend zero
    # runner minutes. Reads credential presence via job `env:` because `secrets`
    # is unavailable in job `if:` conditions.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      credential: ${{ steps.detect.outputs.credential }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
    steps:
      - name: Detect which Claude credential shape is configured
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            shape=static
          elif [ -n "${ANTHROPIC_FEDERATION_RULE_ID:-}" ] && [ -n "${ANTHROPIC_ORGANIZATION_ID:-}" ]; then
            shape=federation
          else
            shape=none
          fi
          echo "credential=${shape}" >> "${GITHUB_OUTPUT}"
          if [ "${shape}" = none ]; then
            echo "::notice title=Claude review not configured::No Claude credential is set, so the review job is skipped. This is not an error."
            {
              echo "### Claude review skipped — no credential configured"
              echo
              echo "The review job did not run because no Claude credential is set."
              echo "Set **one** of the two shapes, not both:"
              echo
              echo "- Static credential: repository secret \`ANTHROPIC_API_KEY\`, or \`CLAUDE_CODE_OAUTH_TOKEN\` from \`claude setup-token\`."
              echo "- Workload identity federation: repository variables \`ANTHROPIC_FEDERATION_RULE_ID\` and \`ANTHROPIC_ORGANIZATION_ID\` (and optionally \`ANTHROPIC_SERVICE_ACCOUNT_ID\`)."
              echo
              echo "If you do not want AI review on this repository, delete \`.github/workflows/claude-code-review.yml\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Claude credential shape detected: ${shape}."
            echo "Delete .github/workflows/claude-code-review.yml to opt out of this lane."
          fi

  claude-review:
    needs: credential-preflight
    # Positive predicate: a skipped preflight leaves outputs.credential empty,
    # so `== 'static' || == 'federation'` binds this job via value and dependency.
    if: >-
      needs.credential-preflight.outputs.credential == 'static'
      || needs.credential-preflight.outputs.credential == 'federation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Read repository files and PR diff
      pull-requests: write # Post review comments on the pull request
      issues: read # Read linked issue context
      id-token: write # Required by anthropics/claude-code-action OIDC exchange
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1.0.220
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Enable tracking comment and explicit MCP comment tools without granting shell access.
          track_progress: "true"
          # Resolves from template-local .claude/commands/review-pr.md (no unpinnable plugin marketplace).
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: >-
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
