# Template Press rules for this Cargo workspace blueprint (R15).
# Comments here stay free of literal source identity tokens: press control files
# are not rewritten during stamping, so any literal would ship stale into forks.

[rules]
languages = ["rust"]
# Keep external GitHub Action references and MIT upstream provenance notices intact.
keep_names = [
    "smorinlabs/difftree-action",
    "smorinlabs/smorinlabs-skills",
    "smorinlabs/py-launch-blueprint",
    "smorinlabs/ts-launch-blueprint",
    "smorinlabs/contributors-please-action",
]
# The CLI binary name and repo name appear glued inside Cargo env vars
# (`CARGO_BIN_EXE_<app>`), suffixed targets (`<app>-serve`, `<repo>-client`,
# `<repo>-${ver}`), and UPPERCASE env prefixes.
substring_rewrite_fields = ["app_name", "app_name_upper", "repo_name"]
extra_exclude_files = [
    "Cargo.lock",
    "README.md",
    "docs/POST_INIT.md",
    "PROJECTS.md",
    ".release-please-manifest.json",
    ".claude/skills/new-rust-project/README.md",
    "docs/README.md",
    "docs/skills/new-rust-project.md",
    ".github/SECURITY.md",
]

[[clean]]
paths = ["src", "crates", "tests"]

# Cargo.lock is excluded from text rewrites and regenerated offline under the new identity.
[[regenerate]]
file = "Cargo.lock"
command = ["cargo", "update", "--workspace", "--offline"]
env = ["CARGO_HOME", "RUSTUP_HOME"]

# Template-only workflows, governance state, bootstrap skill, acceptance tests,
# research artifacts, and serial-chain scripts removed when stamping a child repo.

[[remove]]
file = ".github/workflows/template-receipt-guard.yml"
reason = "template-only receipt guard; stamped projects legitimately commit press/press-receipt.toml"

