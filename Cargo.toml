[workspace]
# Literal member paths (not `crates/*`) so release-please `release-type: rust` discovers
# and updates every workspace member and `Cargo.lock` atomically (R23 S6a/S6c).
members = [
    "crates/cli",
    "crates/core",
    "crates/web",
]
# Default workspace commands build and test the standalone library, core, and CLI without pulling
# in the optional Axum/Tokio web service (`OV-18`). Pass `--workspace` or `-p rs-launch-blueprint-web`
# to include the web service crate.
default-members = [
    ".",
    "crates/core",
    "crates/cli",
]
resolver = "3"

[workspace.package]
# `version` is declared literally on each member `[package]` rather than inherited here,
# because release-please rejects `version.workspace = true` (R23 S7c).
authors = ["Steve Morin <steve.morin@gmail.com>"]
edition = "2024"
homepage = "https://smorinlabs.github.io/rs-launch-blueprint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smorinlabs/rs-launch-blueprint"
rust-version = "1.98"

[workspace.lints.rust]
# Safe-authoring hard boundary (R06): single source of truth; inherited via `[lints] workspace = true`.
unsafe_code = "forbid"
# Curated public-API surface enforcement (R04).
unreachable_pub = "deny"
private_interfaces = "deny"
private_bounds = "deny"
missing_docs = "deny"
# Type-check strictness (R30); priority = -1 allows individual lints to override.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Pre-armed R06 safety-comment lints so any fork downgrading `unsafe_code` to `deny`
# inherits a complete safety-comment regime in a one-token edit. `unnecessary_safety_comment`
# is active under `forbid` and rejects stray `// SAFETY:` comments on safe code.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
# Per-member disallowed API enforcement (R02 F009 + per-crate clippy.toml + OV-18).
disallowed_types = "deny"
disallowed_methods = "deny"
# Named lints on top of Clippy's default groups (R28; no group line so correctness stays deny).
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[package]
name = "rs-launch-blueprint"
version = "0.1.0"
authors.workspace = true
autobins = false
categories = ["development-tools", "api-bindings"]
edition.workspace = true
homepage.workspace = true
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT",
]
keywords = ["blueprint", "library", "hexagonal", "http", "sdk"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Standalone Rust library for rs-launch-blueprint: domain models, ports, services, and optional HTTP, config, and keychain adapters."

[package.metadata.docs.rs]
all-features = true

[lib]
name = "rs_launch_blueprint"
path = "src/lib.rs"

[features]
default = ["http", "config"]
http = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:zeroize"]
config = ["rs-launch-blueprint-core/config"]
mock = ["rs-launch-blueprint-core/mock"]
keychain = [
    "dep:keyring-core",
    "dep:zeroize",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dependencies]
keyring-core = { version = "1.0.0", optional = true }
rs-launch-blueprint-core = { version = "0.1.0", path = "crates/core", default-features = false }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
ureq = { version = "3.4.2", features = ["json"], optional = true }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = [
    "rt-async-io-crypto-rust",
], optional = true }

[dev-dependencies]
httpmock = { version = "0.8.3", default-features = false }
proptest = "1.11.0"
secrecy = "0.10.3"
serde_json = "1.0.151"
tempfile = "3.27.0"
toml = "1.1.6"

[lints]
workspace = true

# Release build profile (R68 Subject B): write exactly `lto` and `codegen-units`;
# deliberately leave `opt-level` (3), `strip` ("none", preserving panic backtraces),
# `panic` ("unwind", preserving R67 exit/flush semantics), and `debug` (false) at
# Cargo defaults. Downstream library consumers ignore dependency `[profile.*]` tables.
[profile.release]
lto = "fat"
codegen-units = 1

# Profile used by `cargo-dist` (`dist`); inherits `[profile.release]` verbatim with
# no `lto = "thin"` override so released binaries keep fat LTO (R68 AC6).
[profile.dist]
inherits = "release"
