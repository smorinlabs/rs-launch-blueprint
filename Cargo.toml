[workspace]
# Literal member paths (not `crates/*`) so release-please `release-type: rust` discovers
# and updates every workspace member and `Cargo.lock` atomically (R23 S6a/S6c).
members = [
    "crates/cli",
    "crates/core",
    "crates/web",
]
resolver = "3"

[workspace.package]
# `version` is declared literally on each member `[package]` rather than inherited here,
# because release-please rejects `version.workspace = true` (R23 S7c).
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smorinlabs/rs-launch-blueprint"
rust-version = "1.98"

[workspace.lints.rust]
# Safe-authoring hard boundary (R06): single source of truth; inherited via `[lints] workspace = true`.
unsafe_code = "forbid"
# Curated public-API surface enforcement (R04).
unreachable_pub = "deny"
private_interfaces = "deny"
private_bounds = "deny"
missing_docs = "deny"
# Type-check strictness (R30); priority = -1 allows individual lints to override.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Pre-armed R06 safety-comment lints so any fork downgrading `unsafe_code` to `deny`
# inherits a complete safety-comment regime in a one-token edit. `unnecessary_safety_comment`
# is active under `forbid` and rejects stray `// SAFETY:` comments on safe code.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
# Per-member disallowed API enforcement (R02 F009 + crates/core/clippy.toml).
disallowed_types = "deny"
disallowed_methods = "deny"
# Named lints on top of Clippy's default groups (R28; no group line so correctness stays deny).
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[package]
name = "rs-launch-blueprint"
version = "0.1.0"
autobins = false
default-run = "rslbp"
edition.workspace = true
include = [
    "/src",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT",
]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Production-ready Rust CLI, library, and optional web service blueprint."

[lib]
name = "rs_launch_blueprint"
path = "src/lib.rs"

[[bin]]
name = "rslbp"
path = "src/main.rs"

[[bin]]
name = "rslbp-serve"
path = "src/bin/serve.rs"
required-features = ["web"]

[features]
default = ["clipboard"]
clipboard = ["dep:arboard"]
web = ["dep:rs-launch-blueprint-web"]
otel = [
    "web",
    "rs-launch-blueprint-web/otel",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
]
metrics = ["web", "rs-launch-blueprint-web/metrics"]
mock = ["rs-launch-blueprint-core/mock"]
keychain = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
keyring-core = { version = "1.0.0", optional = true }
opentelemetry = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false, features = [
    "trace",
] }
opentelemetry-http = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false }
opentelemetry-otlp = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "internal-logs",
] }
opentelemetry_sdk = { version = ">=0.33.0, <0.34.0", optional = true, default-features = false, features = [
    "trace",
] }
rs-launch-blueprint-cli = { version = "0.1.0", path = "crates/cli" }
rs-launch-blueprint-core = { version = "0.1.0", path = "crates/core" }
rs-launch-blueprint-web = { version = "0.1.0", path = "crates/web", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-opentelemetry = { version = ">=0.34.0, <0.35.0", optional = true, default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4.4", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = [
    "rt-async-io-crypto-rust",
], optional = true }

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = { version = "0.8.3", default-features = false }
predicates = "3.1.4"
proptest = "1.11.0"
secrecy = "0.10.3"
tempfile = "3.27.0"
toml = "1.1.6"

[lints]
workspace = true

# Release build profile (R68 Subject B): write exactly `lto` and `codegen-units`;
# deliberately leave `opt-level` (3), `strip` ("none", preserving panic backtraces),
# `panic` ("unwind", preserving R67 exit/flush semantics), and `debug` (false) at
# Cargo defaults. Downstream library consumers ignore dependency `[profile.*]` tables.
[profile.release]
lto = "fat"
codegen-units = 1

# Profile used by `cargo-dist` (`dist`); inherits `[profile.release]` verbatim with
# no `lto = "thin"` override so released binaries keep fat LTO (R68 AC6).
[profile.dist]
inherits = "release"
